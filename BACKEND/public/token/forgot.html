<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AUTH</title>
    <link rel="stylesheet" type="text/css" href="./token.css">
</head>
<body>
        <header id="header"></header>
         <div class="container" id="login-container">
                 <h2>Forgot Password</h2>
                 
                 <!-- Step 1: Enter Email -->
                 <div id="email-step">
                     <input type="email" id="email" placeholder="Enter your email" required>
                     <button class="submit" onclick="sendOTP()">Send OTP</button>

                 </div>
     
                 <!-- Step 2: Enter OTP and New Password (Initially Hidden) -->
                 <div id="otp-step" style="display: none;">
                     <input type="text" id="otp" placeholder="Enter OTP" required>
                     <input type="password" id="newPassword" placeholder="New password" required>
                     <input type="password" id="confirmPassword" placeholder="Confirm password" required>
                     <button class="submit" onclick="changePassword()">Change Password</button>

                 </div>
         </div>
     
         <div id="response-box" class="response-box"></div>
    <footer id="footer"></footer>
    <script src="./forgot.js"></script>
<script>
    fetch('/layout/header.html')
        .then(response => response.text())
        .then(data => {
            
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = data;
            const headerContent = tempDiv.querySelector('header');  
            document.getElementById('header').innerHTML = headerContent.innerHTML; 
        });

    fetch('/layout/footer.html')
        .then(response => response.text())
        .then(data => {
            const tempDiv = document.createElement('div');
            tempDiv.innerHTML = data;
            const footerContent = tempDiv.querySelector('footer');  
            document.getElementById('footer').innerHTML = footerContent.innerHTML;  
        });


</script>
</body>
</html>
