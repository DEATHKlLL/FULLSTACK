
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Register Your PG</title>
    <link rel="stylesheet" href="/pg/style.css" />
</head>
<body>
    <div class="container" id="content-box">
        <h2>Register Your PG</h2>
        <form id="pgForm" enctype="multipart/form-data">
            <label for="pgName">PG Name:</label>
            <input type="text" id="pgName" name="pgName" required />
        
            <label for="pgAddress">Address:</label>
            <input type="text" id="pgAddress" name="pgAddress" required />
            <label for="pgAddress">Price:</label>
            <input type="int" id="price" name="price" required />
            <label for="description">Description:</label><br>
            <textarea id="description" name="description" rows="4" cols="50" placeholder="Enter your description here..."></textarea>
            <label>PinCode</label>
            <input type="number" id="pincode" name="pincode" min="100000" max="399999" required/>
            <label>Amenities:</label>
            <div class="amenities">
                <label for="food">Food</label>
                <input type="checkbox" id="food" name="amenities" value="Food" />
        
                <label for="laundry">Laundry</label>
                <input type="checkbox" id="laundry" name="amenities" value="Laundry" />
        
                <label for="wifi">WiFi</label>
                <input type="checkbox" id="wifi" name="amenities" value="WiFi" />
        
                <label for="parking">Parking</label>
                <input type="checkbox" id="parking" name="amenities" value="Parking" />
                <label for="AC">AC</label>
                <input type="checkbox" id="AC" name="amenities" value="AC" />
                <label for="Gym">GYM</label>
                <input type="checkbox" id="GYM" name="amenities" value="GYM" />
            </div><br><br>
            <label>Select Sharing</label>

            <div class="sharing">
                <label for="2-SHARING">2-SHARING</label>
                <input type="checkbox" id="2-SHARING" name="sharing" value="2-SHARING" />
                <label for="3-SHARING">3-SHARING</label>
                <input type="checkbox" id="3-SHARING" name="sharing" value="3-SHARING" />
                <label for="4-SHARING">4-SHARING</label>
                <input type="checkbox" id="4-SHARING" name="sharing" value="4-SHARING" />
            </div>
            
            <label for="pgImages">Upload PG Images:</label>
            <div class="custom-file-upload" id="uploadArea">
                <p>Click or Drag & Drop Images Here</p>
                <input type="file" id="pgImages" name="pgImages" accept="image/*" multiple required />
            </div>
            <div id="imagePreview"></div>
            <div id="imageModal" class="modal">
                <span class="closeModal">&times;</span>
                <img class="modal-content" id="modalImage">
            </div>
            
            <input type="submit" value="Submit">
        </form>
        
    <script src="/pg/script.js"></script>
    
</body>
</html>
