<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PG Booking Dashboard</title>
    <style>
            .response-box {
            position: fixed;
            top: 20px;
            left: 40%;
            transform: translateX(-50%);
            background-color: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 15px;
            display: none;
            z-index: 1000;
            width: 300px;
            height: 30px;
            text-align: center;
            font-weight: bold;
            animation: pop-up 0.5s ease-out forwards;
        }
        @keyframes pop-up {
            0% {
                transform: scale(0);
                opacity: 0;
            }
            50% {
                transform: scale(1.1);
                opacity: 1;
            }
            100% {
                transform: scale(1);
                opacity: 1;
            }
        }
        body {
            display: flex;
            height: 100vh;
            margin: 0;
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
        }
        .sidebar {
            width: 250px;
            background: white;
            color:black;
            padding: 20px;
            display: flex;
            flex-direction: column;
            position: fixed;
            left: -300px;
            height: 100%;
            transition: left 0.3s;
        }
        .sidebar a {
            
            color:black;
            text-decoration: none;
            padding: 10px;
            display: block;
        }
        .sidebar a:hover {
            background:gray;
        }
        .main-content {
            flex-grow: 1;
            padding: 20px;
            background: white;
            margin-left: 0;
            transition: margin-left 0.3s;
        }
        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: black;
            color: white;
            padding: 15px 20px;
        }
        .content-box {
            background: #fff;
            padding: 20px;
            border-radius: 8px;
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            margin-top: 20px;
        }
        .menu-button {
            box-shadow: 0 0 10px rgba(0, 0, 0, 0.1);
            position: fixed;
            top: 15px;
            left: 15px;
            background: #fff;
            color:black;
            border: none;
            padding: 10px 15px;
            cursor: pointer;
            font-size: 16px;
            z-index: 1000;
        }
        

        .filter-container {
            display: flex;
            justify-content: left;
            gap: 10px;
            margin-bottom: 20px;
        }

        input, select, .checkbox-group {
            padding: 10px;
            border: 1px solid black;
            border-radius: 5px;
            background: white;
        }

        .checkbox-group {
            display: flex;
            gap: 10px;
        }

        .checkbox-group label {
            display: flex;
            align-items: center;
            gap: 5px;
        }

        .pg-list {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 300px));
            gap: 15px;
            justify-content: left;
            padding: 10px;
        }

        .pg-card {
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 15px;
            text-align: center;
            transition: transform 0.3s ease-in-out;
        }

        .pg-card:hover {
            transform: translateY(-5px);
        }

        .pg-card img {
            width:150px;
            height: 180px;
            border-radius: 10px;
        }
        .pg-card h3 {
            margin: 10px 0;
            font-size: 18px;
        }

        .pg-card p {
            font-size: 14px;
            color: #555;
        }

        .amenities {
            font-size: 12px;
            color: #777;
            margin-top: 5px;
        }
        #searchBar{
            width: 400px;
        }
    </style>
</head>
<body>

    <div class="sidebar" id="sidebar">
	<h2></h2>

        <a href="#">PG Booking</a>
    </div>
    <div class="main-content" id="main-content">
        <header style="background-color: #ffffff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1); padding: 16px;">
            <div class="container2" style="width: 90%; margin: 0 auto; display: flex; justify-content: space-between; align-items: center;">
                <b href="#" class="brand" style="font-size: 1.25rem; font-weight: bold; color: #4a5568; font-style: initial;">
                    YourPG
                </b>
                <nav style="display: flex; gap: 24px;">
                    <a href="/" style="color: #4a5568; text-decoration: none; transition: color 0.2s;">Home</a>
                    <a href="#" style="color: #4a5568; text-decoration: none; transition: color 0.2s;">About</a>
                    <a href="#" style="color: #4a5568; text-decoration: none; transition: color 0.2s;">Services</a>
                    <a href="#" style="color: #4a5568; text-decoration: none; transition: color 0.2s;">Contact</a>
                    <a href="/auth" style="color: #4a5568; text-decoration: none; transition: color 0.2s;">Login/Register</a>
                </nav>
                <button class="md:hidden" id="menu-toggle" style="display: none; font-size: 1.5rem; color: #4a5568; background: none; border: none;">☰</button>
            </div>
        </header>
        <div class="content-box" style="">
                        <h2 style="text-align: left;">Welcome to Your PG Booking Application</h2>
            <p>Here you can  book Your PG based on Your Location</p>
            <div id="response-box" class="response-box"></div>
            <h2 style="text-align: center;">Search & Filter PGs</h2>

    <div class="filter-container" >
        <input type="text" id="searchBar"  placeholder="Search by PG name,pincode,location...">


        <div class="checkbox-group">
            <label><input type="checkbox" class="amenity-filter" value="Food"> Food</label>
            <label><input type="checkbox" class="amenity-filter" value="WiFi"> WiFi</label>
            <label><input type="checkbox" class="amenity-filter" value="Laundry"> Laundry</label>
            <label><input type="checkbox" class="amenity-filter" value="Parking"> Parking</label>
            <label><input type="checkbox" class="amenity-filter" value="GYM"> GYM</label>
            <label><input type="checkbox" class="amenity-filter" value="AC"> AC</label>
        </div>
    </div><br><br>

    <div class="pg-list" id="pgList"></div>
    
        </div>
        <div style="padding-top: 3px;padding-bottom: 3px;">
        <footer style="background-color: #ffffff; box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);  padding: 2px; text-align: center; color: #4a5568;">
            <div class="container1" style="margin: 0 auto; padding: 0 1rem;">
                &copy; 2025 YourPG . All rights reserved.
                <div class="social-icons" style="display: flex; justify-content: center; gap: 1rem; margin-top: 1rem;">
                    <a href="#" aria-label="Facebook" style="color: #4a5568; transition: color 0.3s;">

                    </a>
                    <a href="#" aria-label="LinkedIn" style="color: #4a5568; transition: color 0.3s;">
                        <img src="https://cdn-icons-png.flaticon.com/512/733/733561.png" alt="LinkedIn" style="width: 1.5rem; height: 1.5rem;">
                    </a>
                </div>
            </div>
        </footer>
        </div>
    </div>
    <script>
        function toggleSidebar() {
            const sidebar = document.getElementById("sidebar");
            const mainContent = document.getElementById("main-content");
            if (sidebar.style.left === "0px") {
                sidebar.style.left = "-300px";
                mainContent.style.marginLeft = "0";
            } else {
                sidebar.style.left = "0px";
                mainContent.style.marginLeft = "300px";
            }
        }
        function showResponse(message, color) {
            const responseBox = document.getElementById("response-box");
            responseBox.textContent = message;
            responseBox.style.backgroundColor = color;
            responseBox.style.display = "block";

            // Hide the box after 3 seconds
            setTimeout(() => {
                responseBox.style.display = "none";
            }, 3000);
        }

        async function fetchPGs() {
    const searchQuery = document.getElementById("searchBar").value.trim();
    
    // Get all selected amenities
    const selectedAmenities = Array.from(document.querySelectorAll(".amenity-filter:checked"))
        .map(checkbox => checkbox.value);

    // Convert the amenities to a JSON string for backend query
    const amenityQuery = encodeURIComponent(JSON.stringify(selectedAmenities));

    // Construct API URL with parameters
    const response = await fetch(`/pg/find?search=${encodeURIComponent(searchQuery)}&amenity=${amenityQuery}`);
    const pgData = await response.json();

    displayPGs(pgData);
}

// Function to Display PGs
function displayPGs(pgData) {
    const pgList = document.getElementById("pgList");
    pgList.innerHTML = "";

    if (pgData.length === 0) {
        pgList.innerHTML = "<p>No PGs found.</p>";
        return;
    }

    pgData.forEach(pg => {
        const pgCard = document.createElement("div");
        pgCard.classList.add("pg-card");

        pgCard.innerHTML = `
            <h3>${pg.name}</h3>
            <img src="/uploads/${pg.img_path[0]}" alt="${pg.name}">
            <p>${pg.address}</p>
            <p><strong>Price:</strong> ₹${pg.Price}</p>
            <p><strong>Amenities:</strong> ${pg.emenities.join(", ")}</p>
        `;
        pgList.appendChild(pgCard);
    });
}
document.getElementById("searchBar").addEventListener("input", fetchPGs);
document.querySelectorAll(".amenity-filter").forEach(checkbox => {
    checkbox.addEventListener("change", fetchPGs);
});
fetchPGs();


    </script>
</body>
</html>
