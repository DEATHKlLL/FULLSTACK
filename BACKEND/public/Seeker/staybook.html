<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <h1>Short Stay Booking</h1>
    <form method="post">
        Start-Date
        <input type="date" name="start" min="" id="startDate"/><br>
        End-Date
        <input type="date" name="end" min="" id="endDate"/><br>
        <label>
            <input type="radio" name="sharing" value="2" />
            2-SHARING
          </label><br />
          
          <label>
            <input type="radio" name="sharing" value="3" />
            3-SHARING
          </label><br />
          <label>
            <input type="radio" name="sharing" value="4" />
            4-SHARING
          </label><br>
        <input type="submit" value="submit" />
    </form>
    <script>
        const today = new Date().toISOString().split('T')[0];
        const startDate = document.getElementById("startDate");
        const endDate = document.getElementById("endDate");
      
        startDate.setAttribute("min", today);
        
        startDate.addEventListener("change", () => {
          endDate.value = "";
          endDate.setAttribute("min", startDate.value);
        });
      </script>
      
</body>
</html>
